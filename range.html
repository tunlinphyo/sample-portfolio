<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popover View Transition Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.14 0.02 260);
      --surface: oklch(0.2 0.02 260);
      --surface-2: oklch(0.24 0.02 260);
      --text: oklch(0.96 0.01 260);
      --muted: oklch(0.72 0.02 260);
      --border: oklch(0.34 0.02 260 / 0.7);
      --accent: oklch(0.72 0.18 255);
      --shadow: 0 24px 80px oklch(0 0 0 / 0.35);
      --radius: 1.5rem;
      --ease: linear(
        0,
        0.009,
        0.035 2.1%,
        0.141,
        0.281 6.7%,
        0.723 12.9%,
        0.938 16.7%,
        1.017,
        1.077,
        1.121,
        1.149 24.3%,
        1.159,
        1.163,
        1.161,
        1.154 29.9%,
        1.129 32.8%,
        1.051 39.6%,
        1.017 43.1%,
        0.991,
        0.977 51%,
        0.974 53.8%,
        0.975 57.1%,
        0.997 69.8%,
        1.003 76.9%,
        1.001
      );
      --duration: 1000ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, oklch(0.22 0.04 250), transparent 40%),
        radial-gradient(circle at bottom right, oklch(0.18 0.04 300), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      padding: 2rem;
    }

    .demo {
      width: min(100%, 60rem);
      min-height: 32rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 2rem;
      background: oklch(0.18 0.015 260 / 0.75);
      box-shadow: var(--shadow);
      backdrop-filter: blur(1.25rem);
      position: relative;
      overflow: clip;
    }

    .trigger-wrap {
      display: grid;
      gap: 1rem;
      justify-items: center;
      text-align: center;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .trigger {
      anchor-name: --popover-anchor;
      appearance: none;
      border: 0;
      cursor: pointer;
      min-width: 14rem;
      padding: 1rem 1.35rem;
      border-radius: 999px;
      background:
        linear-gradient(180deg, oklch(0.78 0.16 255), oklch(0.66 0.18 255));
      color: white;
      box-shadow:
        0 0.5rem 1rem oklch(0.1 0.04 255 / 0.35),
        inset 0 1px 0 oklch(1 0 0 / 0.25);
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.01em;
      position: relative;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
      view-transition-name: trigger-card;
    }

    .trigger:hover {
      transform: translateY(-2px);
    }

    .trigger:active {
      transform: translateY(0);
    }

    .trigger__label {
      display: inline-block;
      view-transition-name: title-text;
    }

    .popover {
      position: fixed;
      position-anchor: --popover-anchor;
      top: anchor(bottom);
      left: anchor(center);
      translate: -50% 1rem;
      margin: 0;
      width: min(92vw, 28rem);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 0.25rem);
      padding: 0;
      background: transparent;
      color: var(--text);
      overflow: visible;
      box-shadow: none;
    }

    .popover:popover-open {
      animation: pop-in var(--duration) var(--ease);
    }

    .popover::backdrop {
      background: oklch(0.04 0 0 / 0.32);
      backdrop-filter: blur(0.3rem);
    }

    .popover__card {
      position: relative;
      border-radius: inherit;
      background:
        linear-gradient(180deg, oklch(0.25 0.02 260), oklch(0.2 0.02 260));
      box-shadow:
        var(--shadow),
        inset 0 1px 0 oklch(1 0 0 / 0.06);
      overflow: clip;
    }

    .popover__card::before {
      content: "";
      position: absolute;
      inset: -1rem;
      z-index: -1;
      border-radius: inherit;
      background:
        radial-gradient(circle at top, oklch(0.72 0.18 255 / 0.22), transparent 35%),
        radial-gradient(circle at bottom right, oklch(0.7 0.16 320 / 0.16), transparent 30%);
      filter: blur(1.5rem);
      pointer-events: none;
    }

    .popover__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1.25rem 0.75rem;
    }

    .popover__title {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.02em;
      view-transition-name: title-text;
    }

    .close {
      appearance: none;
      border: 0;
      background: oklch(0.3 0.02 260);
      color: var(--text);
      width: 2.25rem;
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      display: grid;
      place-items: center;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .close:hover {
      transform: scale(1.05);
      background: oklch(0.34 0.02 260);
    }

    .popover__body {
      padding: 0 1.25rem 1.25rem;
      display: grid;
      gap: 1rem;
    }

    .popover__text {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .chip {
      padding: 0.55rem 0.8rem;
      border-radius: 999px;
      background: oklch(0.28 0.02 260);
      color: var(--text);
      border: 1px solid oklch(0.38 0.02 260 / 0.8);
      font-size: 0.9rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    .button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.85rem 1rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .button--primary {
      background: var(--accent);
      color: black;
    }

    .button--ghost {
      background: oklch(0.28 0.02 260);
      color: var(--text);
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(-0.25rem) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @supports (transition-behavior: allow-discrete) {
      .popover {
        transition:
          opacity 220ms ease,
          transform 220ms ease,
          display 220ms allow-discrete,
          overlay 220ms allow-discrete;
      }

      @starting-style {
        .popover:popover-open {
          opacity: 0;
          transform: translateY(-0.25rem) scale(0.96);
        }
      }
    }

    ::view-transition-group(trigger-card),
    ::view-transition-group(title-text) {
      animation-duration: var(--duration);
      animation-timing-function: var(--ease);
    }

    ::view-transition-old(trigger-card),
    ::view-transition-new(trigger-card),
    ::view-transition-old(title-text),
    ::view-transition-new(title-text) {
      animation-duration: var(--duration);
      animation-timing-function: var(--ease);
      mix-blend-mode: normal;
    }

    @media (prefers-reduced-motion: reduce) {
      .trigger,
      .close,
      .popover,
      ::view-transition-group(trigger-card),
      ::view-transition-group(title-text),
      ::view-transition-old(trigger-card),
      ::view-transition-new(trigger-card),
      ::view-transition-old(title-text),
      ::view-transition-new(title-text) {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="demo">
    <div class="trigger-wrap">
      <button
        id="openButton"
        class="trigger"
        type="button"
        aria-haspopup="dialog"
        aria-controls="demoPopover"
      >
        <span id="triggerLabel" class="trigger__label">Color Picker</span>
      </button>
      <p class="hint">Open and close the popover. The text morphs into the title.</p>
    </div>
  </main>

  <div
    id="demoPopover"
    class="popover"
    popover="manual"
    role="dialog"
    aria-labelledby="popoverTitle"
  >
    <section class="popover__card">
      <header class="popover__header">
        <h2 id="popoverTitle" class="popover__title" hidden>Color Picker</h2>
        <button id="closeButton" class="close" type="button" aria-label="Close">×</button>
      </header>

      <div class="popover__body">
        <p class="popover__text">
          This popover is anchored to the button with CSS anchor positioning and opened
          through a view transition so the trigger and title animate smoothly.
        </p>

        <div class="chips">
          <span class="chip">Popover</span>
          <span class="chip">Anchor Position</span>
          <span class="chip">View Transition</span>
          <span class="chip">Shared Element</span>
        </div>

        <div class="actions">
          <button class="button button--primary" type="button">Apply</button>
          <button class="button button--ghost" type="button">Reset</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const openButton = document.getElementById("openButton");
    const closeButton = document.getElementById("closeButton");
    const popover = document.getElementById("demoPopover");
    const triggerLabel = document.getElementById("triggerLabel");
    const popoverTitle = document.getElementById("popoverTitle");

    let isTransitioning = false;

    function supportsViewTransition() {
      return typeof document.startViewTransition === "function";
    }

    function isOpen() {
      return popover.matches(":popover-open");
    }

    function updateSharedState(open) {
      triggerLabel.hidden = open;
      popoverTitle.hidden = !open;
      openButton.setAttribute("aria-expanded", String(open));
    }

    async function runTransition(domUpdate) {
      if (isTransitioning) return;

      isTransitioning = true;

      try {
        if (!supportsViewTransition()) {
          domUpdate();
          return;
        }

        let transition;

        try {
          transition = document.startViewTransition(() => {
            domUpdate();
          });
        } catch (error) {
          domUpdate();
          return;
        }

        try {
          await transition.finished;
        } catch (error) {
          // aborted transition, ignore and keep final DOM state
        }
      } finally {
        isTransitioning = false;
      }
    }

    async function openPopover() {
      if (isOpen() || isTransitioning) return;

      await runTransition(() => {
        updateSharedState(true);

        if (!isOpen()) {
          popover.showPopover();
        }
      });
    }

    async function closePopover() {
      if (!isOpen() || isTransitioning) return;

      await runTransition(() => {
        updateSharedState(false);

        if (isOpen()) {
          popover.hidePopover();
        }
      });

      openButton.focus();
    }

    openButton.addEventListener("click", async () => {
      if (isOpen()) {
        await closePopover();
      } else {
        await openPopover();
      }
    });

    closeButton.addEventListener("click", async () => {
      await closePopover();
    });

    popover.addEventListener("toggle", (event) => {
      const open = event.newState === "open";
      updateSharedState(open);
    });

    document.addEventListener("keydown", async (event) => {
      if (event.key === "Escape" && isOpen()) {
        event.preventDefault();
        await closePopover();
      }
    });
  </script>
</body>
</html>
