<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multicolor Glow Ring Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #0b0b0d;
      --text: #f5f5f5;
      --muted: #a1a1aa;

      --ring-size: 12px;
      --ring-glow-blur: 28px;
      --ring-glow-opacity: 0.95;
      --ring-rotation-speed: 7s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #10131a 0%, #050505 45%, #020202 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .demo {
      width: min(92vw, 900px);
      min-height: 520px;
      display: grid;
      place-items: center;
      gap: 32px;
      padding: 48px 24px;
      border-radius: 32px;
      background:
        linear-gradient(180deg, rgb(255 255 255 / 0.03), rgb(255 255 255 / 0.01)),
        var(--panel);
      box-shadow:
        0 30px 80px rgb(0 0 0 / 0.45),
        inset 0 1px 0 rgb(255 255 255 / 0.05);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .demo::before {
      content: "";
      position: absolute;
      inset: auto -10% -30% -10%;
      height: 60%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 20% 90%, rgb(139 92 246 / 0.45), transparent 30%),
        radial-gradient(circle at 50% 10%, rgb(249 115 22 / 0.35), transparent 35%),
        radial-gradient(circle at 80% 50%, rgb(34 211 238 / 0.3), transparent 32%);
      filter: blur(50px);
      z-index: -1;
      pointer-events: none;
    }

    .content {
      display: grid;
      gap: 16px;
      justify-items: center;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      max-width: 10ch;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.5vw, 1.05rem);
    }

    .ring {
      --size: min(50vw, 240px);
      width: var(--size);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #070707 58%, #030303 100%);
      isolation: isolate;
    }

    /* Outer glow */
    .ring::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: conic-gradient(
        from 220deg,
        #7b5cff 0deg,
        #3b82f6 55deg,
        #06b6d4 110deg,
        #22c55e 165deg,
        #f59e0b 240deg,
        #ef4444 315deg,
        #7b5cff 360deg
      );
      filter: blur(var(--ring-glow-blur));
      opacity: var(--ring-glow-opacity);
      animation: spin var(--ring-rotation-speed) linear infinite;
      z-index: -2;
    }

    /* Sharp colored ring using mask */
    .ring::after {
      content: "";
      position: absolute;
      inset: 0;
      padding: var(--ring-size);
      border-radius: 50%;
      background: conic-gradient(
        from 220deg,
        #7b5cff 0deg,
        #3b82f6 55deg,
        #06b6d4 110deg,
        #22c55e 165deg,
        #f59e0b 240deg,
        #ef4444 315deg,
        #7b5cff 360deg
      );
      animation: spin var(--ring-rotation-speed) linear infinite;

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .ring__inner {
      width: calc(100% - (var(--ring-size) * 2) - 10px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 30%, rgb(255 255 255 / 0.04), transparent 30%),
        radial-gradient(circle at center, #090909 0%, #040404 70%, #020202 100%);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 0.06),
        inset 0 0 40px rgb(0 0 0 / 0.65);
    }

    .ring__label {
      display: grid;
      gap: 6px;
      text-align: center;
    }

    .ring__label strong {
      font-size: 1rem;
      letter-spacing: 0.18em;
    }

    .ring__label span {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    button {
      appearance: none;
      border: 0;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgb(255 255 255 / 0.08);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    button:hover {
      background: rgb(255 255 255 / 0.13);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring::before,
      .ring::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="demo">
    <div class="content">
      <h1>Multicolor Glow Ring</h1>
      <p>Conic gradient + blur + mask. This is the clean way to build that effect.</p>
    </div>

    <div class="ring" id="ring">
      <div class="ring__inner">
        <div class="ring__label">
          <strong>START</strong>
          <span>Demo Ring</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="toggleAnimation">Toggle Animation</button>
      <button type="button" id="thinRing">Thin Ring</button>
      <button type="button" id="thickRing">Thick Ring</button>
      <button type="button" id="softGlow">Soft Glow</button>
      <button type="button" id="strongGlow">Strong Glow</button>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const ring = document.getElementById("ring");
    const toggleAnimation = document.getElementById("toggleAnimation");
    const thinRing = document.getElementById("thinRing");
    const thickRing = document.getElementById("thickRing");
    const softGlow = document.getElementById("softGlow");
    const strongGlow = document.getElementById("strongGlow");

    let animated = true;

    toggleAnimation.addEventListener("click", () => {
      animated = !animated;
      ring.style.setProperty(
        "--ring-rotation-speed",
        animated ? "7s" : "0s"
      );
      ring.style.setProperty(
        "animation-play-state",
        animated ? "running" : "paused"
      );
      ring.style.setProperty("--ring-rotation-speed", animated ? "7s" : "999999s");
    });

    thinRing.addEventListener("click", () => {
      root.style.setProperty("--ring-size", "8px");
    });

    thickRing.addEventListener("click", () => {
      root.style.setProperty("--ring-size", "18px");
    });

    softGlow.addEventListener("click", () => {
      root.style.setProperty("--ring-glow-blur", "20px");
      root.style.setProperty("--ring-glow-opacity", "0.55");
    });

    strongGlow.addEventListener("click", () => {
      root.style.setProperty("--ring-glow-blur", "34px");
      root.style.setProperty("--ring-glow-opacity", "1");
    });
  </script>
</body>
</html>
